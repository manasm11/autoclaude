# autoclaude.toml — Add self-healing auto-fix retry to autoclaude
# Run from autoclaude project root: autoclaude

max_retries = 3
update_docs = true

# ── Step 1: Add StatusFixing and auto-fix types ─────────

[[command]]
prompt = """
In internal/types/types.go:

1. Add a new StatusFixing CommandStatus constant (place it after StatusRetrying).
   Update the String() method to return "Fixing".

2. Add these fields to the Command struct:
   - LastFailedStep string — which step failed: "planning", "execution", or "verification"
   - LastExitCode int — exit code of the failed process
   - LastStderr string — stderr from the failed step
   - LastStdout string — stdout from the failed step
   - FixAttempts int — number of auto-fix attempts made so far

3. Add a method BuildFixPrompt() string on Command that generates a comprehensive prompt for Claude to fix the issue. The prompt should include:
   - The original task prompt
   - Which step failed (planning/execution/verification)
   - The exit code
   - The full stderr output
   - The full stdout output
   - The plan that was used (if available from PlanOutput)
   - Clear instruction: "The above command failed. Analyze the error output carefully and fix the issue. Do not start from scratch — identify what went wrong and make targeted fixes to resolve the error."

4. Remove any existing plain retry logic references from types if present — retries are now always auto-fix attempts.
"""
verify = "go build ./..."

# ── Step 2: Replace retry logic with auto-fix in runner ──

[[command]]
prompt = """
In internal/runner/runner.go, completely replace the existing retry mechanism with an auto-fix loop. The new flow for each command is:

EXECUTION FLOW:
1. StatusPlanning → run claude to generate plan
2. StatusRunning → run claude to execute plan
3. StatusVerifying → run verify command (if set)
4. If ANY of the above steps fail:
   a. Record failure details in cmd: LastFailedStep, LastExitCode, LastStderr, LastStdout
   b. Increment cmd.FixAttempts
   c. If cmd.FixAttempts < cmd.MaxRetries:
      - Set status to StatusFixing, send StatusUpdateMsg
      - Sleep 2 seconds
      - Run claude with the auto-fix prompt: `claude --dangerously-skip-permissions -p "<cmd.BuildFixPrompt()>"`
      - The fix prompt tells Claude what failed and asks it to fix the issue in the codebase
      - After the fix claude call completes (regardless of its own exit code), re-run the VERIFICATION step only (not the full planning+execution cycle again, since the fix was applied directly)
      - If verification passes → StatusSuccess (proceed to documenting/committing)
      - If verification fails again → loop back to step 4a (another fix attempt)
      - If no verify command is set, assume the fix succeeded after the fix claude call returns exit code 0
   d. If cmd.FixAttempts >= cmd.MaxRetries → StatusFailed, stop execution

2. Remove the old StatusRetrying state entirely from the runner flow — it's replaced by StatusFixing.

3. Append clear separators to cmd.Output for each fix attempt:
   "\\n═══ FIX ATTEMPT N/M ═══\\n"
   "Failed step: <step> | Exit code: <code>\\n"
   "Stderr: <last 50 lines of stderr>\\n"
   "Fix output: <claude fix output>\\n"

4. The fix attempt should capture its own stdout/stderr and add an AttemptLog entry with FailedStep set to "auto-fix".

5. Important: after a successful fix, clear PlanOutput and don't re-plan. The fix was applied directly to the code, so go straight to verification.
"""
verify = "go vet ./... && go build ./..."

# ── Step 3: Update TUI for StatusFixing ──────────────────

[[command]]
prompt = """
Update the TUI in internal/tui/ to support the new auto-fix flow:

1. Remove StatusRetrying references from the TUI — replace with StatusFixing everywhere.

2. Add color for StatusFixing: orange/yellow with spinner, display text "Fixing (attempt N/M)"

3. In the execution view, when StatusFixing is active, show:
   - "Auto-fixing..." with spinner
   - What failed: "Verification failed (exit code 1)"
   - A condensed view of the error (last 10 lines of stderr)
   - Current fix attempt: "Fix attempt 2/3"

4. Update the status flow in the execution view header:
   Planning → Running → Verifying → [Fixing → Verifying]* → Documenting → Committing → Success

   Where [Fixing → Verifying]* can repeat up to MaxRetries times.

5. In the failure panel (when all fix attempts exhausted), show:
   - "Command failed after N auto-fix attempts"
   - Summary of each attempt: what was tried, what error persisted
   - The final stderr output

6. Update the queue view status indicators:
   - Fixing: orange ⚡ symbol
"""
verify = "go build ./..."

# ── Step 4: Update session for auto-fix state ────────────

[[command]]
prompt = """
Update internal/session/session.go to handle the auto-fix state:

1. Add to SessionCommand: LastFailedStep string, LastExitCode int, LastStderr string, LastStdout string, FixAttempts int

2. When resuming a command that was in StatusFixing:
   - Restore FixAttempts from the session
   - Re-attempt the fix from where it left off (don't reset fix counter)
   - The fix attempt budget on resume = MaxRetries - FixAttempts

3. Remove any references to the old StatusRetrying from session handling.

4. When --reset-attempts flag is used on resume, reset FixAttempts to 0 (giving full fix budget).
"""
verify = "go build ./..."

# ── Step 5: Add TOML option to disable auto-fix ─────────

[[command]]
prompt = """
Add configuration options for auto-fix behavior:

1. In the TOML config, add global option:
   - auto_fix = true  (default: true, set to false to fail immediately without fix attempts)

2. Add per-command override in [[command]]:
   - auto_fix = false  (overrides global for this specific command)

3. Add CLI flag --no-auto-fix that disables auto-fix globally (equivalent to auto_fix = false).

4. In internal/config/config.go:
   - Add AutoFix *bool to ConfigFile
   - Add AutoFix *bool to ConfigCommand
   - Default to true when not specified

5. In internal/types/types.go:
   - Add AutoFix bool field to Command struct (default true)

6. In internal/runner/runner.go:
   - Check cmd.AutoFix before attempting fix. If false, go directly to StatusFailed on any failure.

7. Update the sample TOML generated by `autoclaude init` to include:
   # auto_fix = true  # auto-fix failures using Claude (default: true)

8. Update README.md to document:
   - The auto-fix feature and how it works
   - The fix flow: fail → feed error to Claude → re-verify → repeat
   - auto_fix TOML option (global and per-command)
   - --no-auto-fix flag
   - How MaxRetries controls fix attempts

9. Run go vet and go mod tidy.
"""
verify = "go vet ./... && go build ./..."

# ── Step 6: Remove old retry references ──────────────────

[[command]]
prompt = """
Clean up the entire autoclaude codebase to remove all traces of the old plain retry mechanism:

1. Search the entire codebase for StatusRetrying — remove it from types.go, any switch cases, any TUI rendering, any session handling. It should not exist anywhere.

2. Search for any "retry" wording in user-facing strings and update to "fix attempt" or "auto-fix" as appropriate. For example:
   - "Retrying..." → "Auto-fixing..."
   - "retry limit" → "fix attempt limit"
   - "max_retries" TOML/flag name stays the same (it's the budget for fix attempts now, renaming would break configs)

3. Make sure CLAUDE.md and README.md consistently describe the auto-fix behavior, not "retry".

4. Run go vet, go build, go mod tidy.

5. Review all files touched and make sure there are no compile errors, unused imports, or dead code.
"""
verify = "go vet ./... && go build ./..."
