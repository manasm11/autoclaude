# autoclaude.toml — Fix failure logging & retry mechanism
# Run from the autoclaude project root: autoclaude

max_retries = 3
update_docs = true

# ── Step 1: Separate stdout/stderr capture ──────────────

[[command]]
prompt = """
In internal/runner/runner.go, refactor all os/exec command executions (claude invocations and verify commands) to capture stdout and stderr separately using bytes.Buffer instead of CombinedOutput. For every exec.Cmd:
- Set cmd.Stdout = &stdoutBuf
- Set cmd.Stderr = &stderrBuf
- After execution, capture the exit code using a type assertion to *exec.ExitError (if err != nil, check if exitErr, ok := err.(*exec.ExitError); ok, then use exitErr.ExitCode(), otherwise use -1)
- Store both stdout and stderr separately for later use
Do not change the overall execution flow yet, just fix the output capture plumbing.
"""
verify = "go build ./..."

# ── Step 2: Add AttemptLog type ──────────────────────────

[[command]]
prompt = """
In internal/types/types.go:
1. Add an AttemptLog struct with fields: AttemptNumber int, StartedAt time.Time, EndedAt time.Time, Duration time.Duration, FailedStep string, Command string, ExitCode int, Stdout string, Stderr string, WorkDir string, GitBranch string, GitStatus string
2. Add AttemptLogs []AttemptLog field to the Command struct
3. Add a method FormatFailureReport() string on Command that formats all attempt logs into a readable debug report showing each attempt with its details, stdout, and stderr
4. Update internal/session/session.go SessionCommand to include AttemptLogs so they survive session resume
"""
verify = "go build ./..."

# ── Step 3: Populate AttemptLogs in runner ───────────────

[[command]]
prompt = """
In internal/runner/runner.go, update the execution loop to populate AttemptLog entries for every attempt of every command:
1. Before each attempt starts, record StartedAt, AttemptNumber, and WorkDir
2. Before each attempt, capture git context by running `git branch --show-current` and `git status --porcelain` using exec.Command (ignore errors, just store empty string if git not available)
3. Record the exact shell command string being run in the log
4. After each step (planning/execution/verification/documenting/committing) completes or fails, record EndedAt, Duration, ExitCode, Stdout, Stderr, and FailedStep
5. Append the AttemptLog to cmd.AttemptLogs after every attempt regardless of success or failure
6. Make sure the captured stdout from the separate buffer (from step 1) flows into the AttemptLog.Stdout and stderr into AttemptLog.Stderr
"""
verify = "go build ./..."

# ── Step 4: Fix retry mechanism ──────────────────────────

[[command]]
prompt = """
Audit and fix the retry mechanism in internal/runner/runner.go. The correct behavior must be:

1. MaxRetries means total attempts, not additional retries. So MaxRetries=3 means the command runs at most 3 times.
2. When any step fails (planning, execution, or verification):
   - Increment cmd.Attempts
   - If cmd.Attempts < cmd.MaxRetries: set StatusRetrying, send StatusUpdateMsg, sleep 2 seconds, clear cmd.PlanOutput (force fresh plan), then restart from StatusPlanning
   - If cmd.Attempts >= cmd.MaxRetries: set StatusFailed, stop execution
3. Verification failure must retry the ENTIRE cycle (planning + execution + verification), not just re-run verification
4. Documenting and committing failures are non-fatal and should NOT trigger retries
5. On retry, append a separator to cmd.Output: "\\n═══ RETRY N/M ═══ (previous attempt failed at: <step>, exit code: <code>)\\n"
6. Show "Attempt N/M" in the StatusUpdateMsg so the TUI can display it next to the spinner
7. Fix any off-by-one errors in the retry counter

Trace through the retry flow carefully and make sure every code path sends the correct StatusUpdateMsg to the TUI.
"""
verify = "go vet ./... && go build ./..."

# ── Step 5: Failure report file and TUI ──────────────────

[[command]]
prompt = """
Add failure report output to autoclaude:

1. In internal/runner/runner.go, when a command permanently fails (exhausted retries):
   - Call cmd.FormatFailureReport() to get the formatted report
   - Write it to autoclaude-error.log in the working directory (append mode, don't overwrite)
   - Prefix each report entry with a timestamp header:
     ════════════════════════════════════════
     FAILURE REPORT — <timestamp>
     Command: "<prompt first 100 chars>"
     ════════════════════════════════════════
   - Include the report content in the ExecutionErrorMsg sent to TUI

2. In the TUI execution view (internal/tui/), when a command fails:
   - Show a failure panel with: command index, prompt, total attempts, which step failed last, last exit code
   - Show last attempt's stderr (scrollable)
   - Add keybinding 'l' to toggle expanded view showing all attempts with full stdout/stderr
   - Show a note: "Full report written to autoclaude-error.log"

3. Add autoclaude-error.log to .gitignore

4. Update README.md to document the failure logging behavior and keybindings.
"""
verify = "go build ./..."

# ── Step 6: Session resume respects attempt history ──────

[[command]]
prompt = """
Fix session resume to properly handle retry history:

1. In internal/session/session.go, make sure AttemptLogs are serialized and deserialized in the session JSON
2. When resuming a failed command, set cmd.Attempts = len(cmd.AttemptLogs) so the retry budget accounts for previous attempts
3. Do NOT reset Attempts to 0 on resume — if a command failed 2/3 times before interruption, it should only get 1 more attempt on resume
4. Add a --reset-attempts flag that forces Attempts back to 0 on resume, giving the command a full fresh retry budget (useful after manually fixing an issue)
5. Update the StateResume view to show attempt history: "Command 3: Failed (2/3 attempts used)"
6. Update README.md to document --reset-attempts flag
"""
verify = "go vet ./... && go build ./..."
